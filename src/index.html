<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InvitiqWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- <link rel="icon" type="image/x-icon" href="/images/Invitiq-Fav.png"> -->
  <link rel="icon" type="image/png" href="/images/Invitiq-Fav.png">

  <link rel="icon" type="image/png" sizes="16x16" href="/images/Invitiq-Fav.png">

  <link rel="icon" type="image/png" sizes="32x32" href="/images/Invitiq-Fav.png">

  <link rel="apple-touch-icon" sizes="180x180" href="/images/Invitiq-Fav.png">

  <link rel="manifest" href="/site.webmanifest">

  <meta name="theme-color" content="#227A48">

  <meta name="robots" content="index, follow">
  <meta name="author" content="Invitiq">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Invitiq",
    "url": "https://invitiq.com",
    "logo": "https://invitiq.com/assets/images/logo.png",
    "description": "Invitiq is a digital solutions company providing website development, SEO, digital marketing, branding, social media management, lead generation, and business growth solutions.",
    "email": "info@invitiq.com",
    "sameAs": [
      "https://www.facebook.com/yourpage",
      "https://www.instagram.com/yourpage",
      "https://www.linkedin.com/company/yourpage"
    ]
  },

  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Invitiq",
    "url": "https://invitiq.com",
    "description": "Professional website development, SEO, branding, digital marketing, social media management, and lead generation services.",
    "publisher": {
      "@type": "Organization",
      "name": "Invitiq"
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://invitiq.com/service?search={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>


</head>
<body>
  <app-root></app-root>

  <form
    name="enquiry"
    data-netlify="true"
    hidden>

    <input type="text" name="name">
    <input type="tel" name="phone">
    <input type="text" name="company">
    <select name="service">
        <option value=""></option>
    </select>
    <textarea name="query"></textarea>

  </form>
</body>
</html>
